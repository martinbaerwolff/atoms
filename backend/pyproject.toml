[project]
name = "atoms-backend"
version = "0.1.0"
description = "Atoms — Second Brain backend (FastAPI + Postgres)."
requires-python = ">=3.13"
readme = "../README.md"
license = { text = "MIT" }
authors = [{ name = "Martin Baerwolff", email = "martin.baerwolff@platomo.de" }]

dependencies = [
  "fastapi>=0.118",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "structlog>=24.4",
  "uuid7>=0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "anyio>=4.7",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- ruff ----------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501", # handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"alembic/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- mypy ----------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["uuid_extensions", "uuid_extensions.*"]
ignore_missing_imports = true

# --- pytest --------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-q",
  "--strict-markers",
  "--strict-config",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pydantic._internal._fields",
]

# --- coverage ------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.14.2",
]
