services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atoms_prod
      POSTGRES_USER: atoms
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_prod_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atoms -d atoms_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: prod
    environment:
      DATABASE_URL: postgresql://atoms:${DB_PASSWORD}@db:5432/atoms_prod
      ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_prod_data:
